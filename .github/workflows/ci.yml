name: CI

# The tests of contr's core and of the release notes script. Linux only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The release's notes and release.json (scripts/release-notes.mjs): its test, then a dry run with the GitHub API.
      - name: Release notes test
        run: node --test scripts/release-notes.test.mjs

      - name: Release notes dry run
        run: node scripts/release-notes.mjs --dry-run --json "$RUNNER_TEMP/release.json" && cat "$RUNNER_TEMP/release.json"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xplat -> target
          key: backend

      - name: Backend tests
        run: cargo test --locked --manifest-path xplat/Cargo.toml -p herdr-contr-feed -p herdr-core -p herdr-contr-orch
